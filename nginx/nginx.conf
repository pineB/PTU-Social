server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    root /usr/share/nginx/html;
    index index.html;

    # Actuator живёт на /actuator у бэкенда, наружу отдаём как /api/actuator/health
    location /api/actuator/health {
        proxy_pass http://backend:8080/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Контроллеры бэкенда уже начинаются с /api, поэтому URI не переписываем
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        # Перезапись, а не $proxy_add_x_forwarded_for: бэкенд берёт первый адрес,
        # иначе клиент подделает IP и обойдёт rate limit логина
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # SPA: статика фронтенда с fallback на index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
