spring.application.name=backend

# --- Datasource (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ptu_social}
spring.datasource.username=${DB_USER:ptu}
spring.datasource.password=${DB_PASSWORD:ptu}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:redis}

# --- Mail (Mailpit in local/dev) ---
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Actuator ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# --- Application settings ---
app.base-url=${APP_BASE_URL:http://localhost:3000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.mail.from=${MAIL_FROM:no-reply@ptu.local}

app.registration.ttl=${REGISTRATION_TTL:7d}
app.invite.ttl=${INVITE_TTL:7d}
app.verification.code-ttl=${VERIFICATION_CODE_TTL:10m}
app.verification.max-attempts=${VERIFICATION_MAX_ATTEMPTS:5}
app.verification.max-sends=${VERIFICATION_MAX_SENDS:3}
app.verification.send-window=${VERIFICATION_SEND_WINDOW:15m}
app.verification.resend-interval=${VERIFICATION_RESEND_INTERVAL:60s}

app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef}
app.jwt.ttl=${JWT_TTL:24h}

app.seed.office-email=${SEED_OFFICE_EMAIL:office@ptu.local}
app.seed.office-password=${SEED_OFFICE_PASSWORD:office12345}
